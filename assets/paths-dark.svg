<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" fill="none">
  <style>
    .ink { stroke: #a1a1aa; }
    .rule { stroke: #3f3f46; }
    .hatch { stroke: #3f3f46; }
    .use { fill: #4c78f5; }
    .label { fill: #8b8b94; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; letter-spacing: .02em; }
  </style>

  <defs>
    <pattern id="down" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path class="hatch" d="M0 0V5" stroke-width="1"/>
    </pattern>
  </defs>

  <g class="label">
    <rect class="use" x="650" y="15" width="10" height="10" rx="1.5"/>
    <text x="668" y="24">in use</text>
    <rect class="rule" x="728.5" y="15.5" width="9" height="9" rx="1.5" fill="url(#down)" stroke-width=".75"/>
    <text x="746" y="24">failed</text>
    <path class="rule" d="M802 20H822" stroke-width="1.5" stroke-dasharray=".1 3.5" stroke-linecap="round"/>
    <text x="828" y="24">unused</text>
  </g>

  <g class="label">
    <text x="0" y="84">direct path</text>
    <text x="0" y="134">proxy path</text>
    <text x="304" y="50">direct path fails</text>
    <text x="684" y="50">proxy path fails</text>
  </g>

  <g class="rule" stroke-width=".75" stroke-dasharray="2 3">
    <path d="M300.5 56V150"/>
    <path d="M680.5 56V150"/>
  </g>

  <g class="rule" stroke-width="1.5" stroke-dasharray=".1 3.5" stroke-linecap="round">
    <path d="M562 80H718"/>
    <path d="M132 130H458"/>
  </g>
  <g class="rule" stroke-width=".75">
    <rect x="300.5" y="72.5" width="259" height="15" rx="2" fill="url(#down)"/>
    <rect x="680.5" y="122.5" width="199" height="15" rx="2" fill="url(#down)"/>
  </g>
  <g class="use">
    <rect x="130" y="72" width="170" height="16" rx="2"/>
    <rect x="720" y="72" width="160" height="16" rx="2"/>
    <rect x="460" y="122" width="220" height="16" rx="2"/>
  </g>

  <g class="ink" stroke-width=".75">
    <path d="M300.5 158v6h160v-6"/>
    <path d="M680.5 158v6h40v-6"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="380" y="182">wait 4 min</text>
    <text x="700" y="182">wait 1 min</text>
  </g>
</svg>
