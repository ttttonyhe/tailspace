<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 112" width="880" height="112" fill="none">
  <style>
    .rule { stroke: #3f3f46; }
    .value { fill: #ededed; }
    .label { fill: #8b8b94; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; letter-spacing: .02em; }
    .big { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 44px; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .unit { font-size: 20px; letter-spacing: 0; }
  </style>

  <g class="rule" stroke-width=".75">
    <path d="M0 .5H880"/>
    <path d="M293.5 1V104"/>
    <path d="M586.5 1V104"/>
  </g>

  <g class="mono label">
    <text x="0" y="28">added to each new shell</text>
    <text x="309" y="28">idle CPU, one core</text>
    <text x="602" y="28">idle memory</text>
  </g>

  <g class="big value">
    <text x="0" y="84">0.9<tspan class="unit label" dx="6">ms</tspan></text>
    <text x="307" y="84">0.14<tspan class="unit label" dx="6">%</tspan></text>
    <text x="600" y="84">30<tspan class="unit label" dx="6">MB</tspan></text>
  </g>
</svg>
